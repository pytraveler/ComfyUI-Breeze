name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pytest and nothing else
        run: python -m pip install --quiet --upgrade pip pytest

      - name: The suite runs without ComfyUI, the scripts with Node
        env:
          BREEZE_REQUIRE_NODE: "1"
        run: python -m pytest tests -q

      - name: The pack compiles
        run: python -m compileall -q __init__.py breeze_comfy

  style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest and nothing else
        run: python -m pip install --quiet --upgrade pip pytest

      - name: ASCII only, docstrings rather than comments
        run: python -m pytest tests/test_source_style.py -q
